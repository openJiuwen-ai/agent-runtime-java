name: agent-runtime-java-ci

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build:
    name: Check Compile Package
    # 确认平台支持 euleros-2.10.1，不支持就替换 ubuntu-latest
    runs-on: euleros-2.10.1
    steps:
      # 修复1：使用官方标准 checkout action
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 自动同步拉取子模块，无需手动写git submodule命令
          submodules: recursive

      # 修复2：官方Java安装Action，稳定版本
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          # 缓存maven依赖，大幅提升构建速度
          cache: maven

      # 无需 cd repo_workspace，代码就在当前目录
      - name: Unit Test
        run: mvn -B -ntp test

      - name: Compile & Package
        run: mvn -B -ntp -DskipTests compile package