name: agent-runtime-java-ci

# 触发条件：push/PR到develop分支
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build:
    name: Check Compile Package
    # GitCode官方内置欧拉镜像，合规可用
    runs-on: euleros-2.10.1
    steps:
      # 1. 拉取代码+递归子模块（平台标准内置插件，0.0.1是官方示范版本）
      - name: Checkout repository
        uses: checkout-action@0.0.1
        with:
          submodules: recursive

      # 2. 初始化子模块兜底（with参数失效时备用）
      - name: Sync Submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      # 3. 配置Java17环境，平台内置setup-java插件
      - name: Set up Java 17
        uses: setup-java@0.0.1
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      # 4. 单元测试
      - name: Unit Test
        run: mvn -B -ntp test

      # 修复非法字符&，改用And，符合平台名称校验规则
      - name: Compile And Package
        run: mvn -B -ntp -DskipTests compile package