# A2A Service Configuration
server.port=8080

# App
a2a-service.app-name=A2A Service

# Redis
a2a-service.redis-host=localhost
a2a-service.redis-port=6379
a2a-service.redis-db=0
a2a-service.redis-session-ttl=1800

# Versatile Adapter
a2a-service.versatile-adapter-url=http://localhost:8081
a2a-service.va-workflow-result-node=GXZQAResponseNode

# LLM
dpa.llm-provider=OpenAI
dpa.llm-api-base=https://api.deepseek.com
dpa.llm-api-key=sk-6e171ab29972497bac1f205c132ae567
dpa.llm-model-name=deepseek-chat
dpa.llm-verify-ssl=false
dpa.llm-user-id=
dpa.llm-token=

# DPA Agent
dpa.dpa-agent-id=edp_agent
dpa.dpa-agent-name=EDP Agent
dpa.dpa-max-iterations=10
dpa.redis-host=localhost
dpa.redis-port=6379
dpa.redis-db=0
dpa.redis-checkpointer-ttl-minutes=60

# Logging
logging.level.root=INFO
logging.level.com.openjiuwen=DEBUG
