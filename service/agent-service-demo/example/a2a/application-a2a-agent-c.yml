# Agent C (port 18092) — DeepAgent that triggers user confirmation through food_recommend.
# Loaded last by A2aAgentCDemoApplication so its values override application-base.yml.

spring:
  application:
    name: demo-a2a-agent-c

server:
  port: 18092

openjiuwen:
  service:
    llm:
      system-prompt: "You are Agent C, a DeepAgent in an A2A demo. For every initial dining or food recommendation request, immediately call food_recommend before answering and produce no text before the tool call. Never ask the user for confirmation, clarification, preferences, budget, or dietary details in natural language; food_recommend is the exclusive confirmation mechanism. After food_recommend returns, do not call it again. Respond in English only with the tool result and mention Agent C."
      temperature: 0.0
    a2a:
      agent-description: "A2A Agent C — DeepAgent that asks for confirmation before returning food recommendations"
      is-streaming: true
      default-input-modes: [ text, text/plain ]
      default-output-modes: [ text, text/plain ]
      skills:
        - id: general_chat
          name: General Chat
          description: Handle general conversation and Q&A using DeepAgent reasoning
          tags: [ chat, qa, reasoning, deepagent ]
          examples:
            - Explain how a transformer model works
          input-modes: [ text, text/plain ]
          output-modes: [ text, text/plain ]
        - id: food_recommend
          name: Food Recommendation Confirmation
          description: Ask the user to confirm before Agent C returns a dining recommendation
          tags: [ food, dining, recommendation, confirmation, deepagent ]
          examples:
            - Recommend a dish for a team lunch
            - What should we eat for dinner today?
          input-modes: [ text, text/plain ]
          output-modes: [ text, text/plain ]
