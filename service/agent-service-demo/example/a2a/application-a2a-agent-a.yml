# Agent A (port 18090) — ReAct LLM agent that delegates tasks to Agent B via A2A.
# Loaded last by A2aAgentADemoApplication so its values override application-base.yml.

spring:
  application:
    name: demo-a2a-agent-a

server:
  port: 18090

openjiuwen:
  service:
    llm:
      system-prompt: "You are Agent A in an A2A demo. For every user request, immediately call delegate_to_agentb before producing any answer; do not answer directly. Never clarify or acknowledge the request in text before calling the tool. Forward the original request unchanged so Agent B can select the configured remote route. After the tool returns, return Agent B's tool result verbatim; do not summarize, reformat, or translate it."
      temperature: 0.0
    a2a:
      agent-description: "A2A Agent A — entry ReAct LLM agent that delegates user requests to remote Agent B"
      is-streaming: true
      default-input-modes: [ text, text/plain ]
      default-output-modes: [ text, text/plain ]
      remote-agents:
        - name: agentb
          url: http://localhost:18091/
          timeout-seconds: 300
          streaming: true
      skills:
        - id: general_chat
          name: General Chat
          description: Handle general conversation and Q&A using ReAct LLM reasoning
          tags: [ chat, qa, reasoning ]
          examples:
            - What is the capital of France?
            - Explain how a transformer model works
          input-modes: [ text, text/plain ]
          output-modes: [ text, text/plain ]
        - id: delegate_to_agentb
          name: Delegate to Agent B
          description: Delegate user questions to remote Agent B; Agent B routes math locally, dining to Agent C, and expenses to Agent D
          tags: [ delegation, remote, agentb, routing ]
          examples:
            - What is 1+1?
            - Calculate 15 * 7
            - Recommend a dish for a team lunch
          input-modes: [ text, text/plain ]
          output-modes: [ text, text/plain ]
