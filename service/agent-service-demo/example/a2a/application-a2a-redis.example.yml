# Redis Checkpointer + A2A Task Store overlay (example / reference).
#
# Copy this file to application-a2a-redis.local.yml (gitignored via **/*.local.yml),
# then add it to the spring.config.import chain at the end of each Application class:
#
#   .properties("spring.config.import=...,optional:classpath:application-a2a-redis.local.yml")
#
# Or simply add the checkpointer and redis sections to your
# application-base_local.yml (the local override file that is already imported).

openjiuwen:
  service:
    middleware:
      checkpointer:
        type: redis
        redis-ref: default
        ttl-seconds: 604800
      redis:
        default:
          type: standalone
          host: 127.0.0.1
          port: 6379
          database: 0
          timeout-ms: 3000
          encrypted-password: ""

        # Redis Cluster example:
        #
        # cluster:
        #   type: cluster
        #   nodes:
        #     - 10.10.1.11:6379
        #     - 10.10.1.12:6379
        #   database: 0 # ignored in cluster mode
        #   timeout-ms: 3000
        #   encrypted-password: ""
