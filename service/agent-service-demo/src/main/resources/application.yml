spring:
  application:
    name: demo-agent-service

server:
  port: 8090

openjiuwen:
  demo:
    llm:
      auto-discover: true
  service:
    version: 0.1.0
    # Lifecycle; defaults apply when omitted
    # lifecycle:
    #   shutdown-timeout-ms: 30000   # max wait (ms) to drain active streams on shutdown
    #   init-fail-fast: true         # fail startup when an AgentInitHook throws
    query:
      mvc:
        enabled: true
      webflux:
        enabled: true
      legacy-path-enabled: true
